<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;background:#0A0A0B;color:#EDEDEF;font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;display:flex}
.mono,.ml,.ax,.kfoot,.cnt,.lab{font-family:Consolas, 'SF Mono', Menlo, monospace}
aside{width:272px;background:#0E0E10;border-right:1px solid #232327;padding:22px 16px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:600;padding:0 8px}
.brand small{color:#8B8B93;font-weight:400}
.lab{font-size:12px;color:#5C5C66;margin:30px 10px 10px}
.nav{display:flex;align-items:center;gap:12px;font-size:15px;color:#B4B4BC;padding:9px 10px;border-radius:8px;margin-bottom:2px}
.nav svg{color:#8B8B93}
.nav.on{background:#1C1C20;color:#EDEDEF;box-shadow:inset 0 0 0 1px #2A2A30}
.nav.on svg{color:#EDEDEF}
.sl{display:flex;align-items:center;gap:12px;font-size:15px;color:#B4B4BC;padding:8px 10px;border-radius:8px}
.sl.on{background:#1C1C20;color:#EDEDEF}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.cnt{margin-left:auto;font-size:13px;color:#5C5C66}
.sep{height:1px;background:#232327;margin:22px 0 0}
.legend{margin-top:auto;font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:12px;color:#8B8B93;padding:0 10px;line-height:1.9}
.legend b{font-weight:400}
.foot{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:11px;color:#5C5C66;padding:14px 10px 0;border-top:1px solid #232327;margin-top:16px;line-height:1.6}
main{flex:1;display:flex;flex-direction:column}
.top{height:56px;border-bottom:1px solid #232327;display:flex;align-items:center;padding:0 36px;gap:10px;font-size:15px;color:#C8C8CF}
.top .r{margin-left:auto;display:flex;align-items:center;gap:18px}
.seg{display:flex;border:1px solid #232327;border-radius:8px;padding:3px;background:#131315}
.seg span{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:12px;color:#8B8B93;padding:4px 11px;border-radius:5px}
.seg span.on{background:#26262B;color:#EDEDEF}
.asof{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:12px;color:#5C5C66}
.body{padding:22px 36px 0}
h1{font-size:40px;font-weight:300;letter-spacing:-.5px}
h1 span{color:#6E6E78}
.sub{font-size:17px;color:#A1A1AA;margin-top:4px}
.sub b{color:#EDEDEF;font-weight:600}
.kpis{display:grid;grid-template-columns:1.75fr 1fr 1fr 1fr 1fr;gap:14px;margin-top:22px}
.kpi{background:#131315;border:1px solid #232327;border-radius:14px;padding:18px 20px 16px;height:184px;display:flex;flex-direction:column}
.kpi>*{flex-shrink:0}
.klabel{font-size:15px;color:#A1A1AA}
.kmid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
.knum{font-size:38px;font-weight:500;letter-spacing:-.5px;line-height:1.05}
.knum small{font-size:20px;color:#8B8B93;margin-left:3px}
.hero .knum{font-size:64px;font-weight:500;letter-spacing:-1.5px}
.bullet{position:relative;height:4px;background:#222227;border-radius:2px;margin-top:16px}
.bullet.none{background:none}
.bullet i{position:absolute;top:0;bottom:0;border-radius:2px}
.bullet .fill{left:0}
.bullet .band{background:#4ADE8040}
.bullet .tick{top:-5px;bottom:-5px;width:2px;background:#E4E4E7}
.kfoot{display:flex;justify-content:space-between;margin-top:auto;font-size:13px}
.ktarget{color:#5C5C66}
.grid2{display:grid;grid-template-columns:1fr 470px;gap:14px;margin-top:14px}
.card{background:#131315;border:1px solid #232327;border-radius:14px}
.chart{height:666px;padding:20px 24px}
.ct{display:flex;justify-content:space-between;align-items:flex-start}
.ctl{font-size:15px;color:#A1A1AA}
.big{font-size:36px;font-weight:500;margin-top:4px;letter-spacing:-.5px}
.delta{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:13px;margin-top:2px}
.lg{display:flex;gap:18px;font-size:13px;color:#B4B4BC;margin-top:6px}
.lg span{display:flex;align-items:center;gap:7px}
.lg em{font-style:normal;font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:12px}
.lg i{width:16px;height:2px;border-radius:1px;display:inline-block}
.ax{font-size:12px;fill:#5C5C66}
.rt{text-align:right}
.june{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:12px;color:#8B8B93;margin-top:12px}
.june b{color:#22D3EE;font-weight:600}
.axh{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:11px;fill:#8B8B93;letter-spacing:.5px}
.endl{font-size:13px;font-family:"Segoe UI"}
.endv{font-family:Consolas, 'SF Mono', Menlo, monospace;font-weight:600}
.anno{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:12px;font-weight:600}
.sites{display:flex;flex-direction:column;gap:14px}
.site{background:#131315;border:1px solid #232327;border-radius:14px;padding:16px 18px 12px;height:212px;display:flex;flex-direction:column}
.shead{display:flex;align-items:center;gap:10px}
.sname{font-size:16px;font-weight:600}
.pill{margin-left:auto;font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:10.5px;letter-spacing:.6px;border:1px solid;border-radius:6px;padding:2px 7px}
.srow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:16px}
.ml{font-size:10.5px;color:#5C5C66;letter-spacing:.4px}
.mv{font-size:18px;font-weight:500;margin-top:4px;white-space:nowrap}
.g{font-size:9px;margin-right:4px;position:relative;top:-2px}
.sfoot{margin-top:auto;border-top:1px solid #1E1E22;padding-top:10px}
.se{color:#8B8B93}
.sfoot svg{display:block;margin-top:2px}

.g2{display:grid;gap:14px;margin-top:14px}
.col{display:flex;flex-direction:column;gap:14px}
.c{background:#131315;border:1px solid #232327;border-radius:14px;padding:18px 22px;display:flex;flex-direction:column;overflow:hidden}
.ch{display:flex;justify-content:space-between;align-items:baseline}
.cq{font-size:17px;font-weight:600}
.cs{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:12px;color:#5C5C66;margin-top:3px}
.lk{font-size:13px;color:#93C5FD;margin-left:auto}
.rl{display:grid;align-items:center;column-gap:14px;padding:9px 0;border-bottom:1px solid #1C1C20;font-size:14px}
.rl:last-child{border-bottom:none}
.rh{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:10.5px;color:#5C5C66;letter-spacing:.4px;padding:14px 0 6px;border-bottom:1px solid #232327}
.mono2{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:13px}
.dim{color:#8B8B93}
.share{position:relative;height:3px;background:#222227;border-radius:2px;margin-top:5px}
.share i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.chip{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:10.5px;border:1px solid #33333A;color:#B4B4BC;border-radius:5px;padding:1px 6px}
.stk{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px}
.stk i{display:block;height:100%}
.kv{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:12px;color:#8B8B93}
.note{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:11.5px;color:#5C5C66;margin-top:auto;padding-top:10px;line-height:1.5}
.note b{color:#FBBF24;font-weight:400}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tgtl{font-family:Consolas, 'SF Mono', Menlo, monospace;font-size:11px;fill:#FBBF24}
